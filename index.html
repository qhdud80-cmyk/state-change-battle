<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>태양계 퀴즈 배틀 | 중학교 1학년 과학 7단원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B1628;
  --bg-panel: #12223D;
  --bg-panel-2: #1A2E50;
  --chalk: #E8EDF5;
  --chalk-dim: #8A9BB5;
  --absorb: #5FD3C4;
  --absorb-dim: #2A6B62;
  --release: #FF8A5C;
  --release-dim: #7A4B36;
  --gold: #FFD166;
  --danger: #FF6B6B;
  --purple: #B07CFF;
  --pink: #FF7CB5;
  --font-display: 'Do Hyeon', sans-serif;
  --font-body: 'Noto Sans KR', sans-serif;
  --radius: 16px;
  --shadow: 0 8px 24px rgba(0,0,0,0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--chalk);
  font-family: var(--font-body);
  min-height: 100vh;
  overscroll-behavior: none;
}

body {
  background-image:
    radial-gradient(circle at 10% 15%, rgba(95,211,196,0.04) 0, transparent 35%),
    radial-gradient(circle at 90% 85%, rgba(176,124,255,0.04) 0, transparent 40%);
}

#app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px 16px 40px;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: 0.5px;
}

button {
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
button:active { transform: scale(0.97); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.btn-primary {
  background: var(--absorb);
  color: #0B211D;
  padding: 14px 28px;
  font-size: 1.05rem;
  box-shadow: var(--shadow);
}
.btn-secondary {
  background: transparent;
  color: var(--chalk);
  border: 2px solid var(--chalk-dim);
  padding: 12px 24px;
}
.btn-warm {
  background: var(--release);
  color: #33150A;
  padding: 14px 28px;
  font-size: 1.05rem;
  box-shadow: var(--shadow);
}
.btn-purple {
  background: var(--purple);
  color: #1a0a33;
  padding: 14px 28px;
  font-size: 1.05rem;
  box-shadow: var(--shadow);
}

.screen { display: flex; flex-direction: column; gap: 18px; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.hidden { display: none !important; }

.panel {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}

.eyebrow {
  color: var(--chalk-dim);
  font-size: 0.85rem;
  letter-spacing: 1px;
}

/* ========== STARFIELD ========== */
#starfield {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

/* ========== START SCREEN ========== */
.title-block { text-align: center; padding: 24px 0 8px; }
.title-block h1 {
  font-size: 2.2rem;
  margin: 0 0 6px;
  background: linear-gradient(135deg, var(--gold), var(--absorb));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.title-block p { color: var(--chalk-dim); margin: 0; }

.planet-showcase {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.planet-orb {
  width: 44px; height: 44px;
  border-radius: 50%;
  animation: orbFloat 3s ease-in-out infinite;
  box-shadow: 0 0 15px rgba(255,255,255,0.15);
}
.planet-orb:nth-child(2) { animation-delay: 0.3s; }
.planet-orb:nth-child(3) { animation-delay: 0.6s; }
.planet-orb:nth-child(4) { animation-delay: 0.9s; }
.planet-orb:nth-child(5) { animation-delay: 1.2s; }
.planet-orb:nth-child(6) { animation-delay: 1.5s; }
.planet-orb:nth-child(7) { animation-delay: 1.8s; }
.planet-orb:nth-child(8) { animation-delay: 2.1s; }

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.orb-mercury { background: radial-gradient(circle at 35% 35%, #c2b8a3, #8a8177); }
.orb-venus { background: radial-gradient(circle at 35% 35%, #ffd699, #c47f17); }
.orb-earth { background: radial-gradient(circle at 35% 35%, #7ec8e3, #1a5c30, #1e3a6e); }
.orb-mars { background: radial-gradient(circle at 35% 35%, #e8734a, #8b2500); }
.orb-jupiter { background: radial-gradient(circle at 35% 35%, #e8c99b, #a0522d); }
.orb-saturn { background: radial-gradient(circle at 35% 35%, #f4d58d, #a67c30); }
.orb-uranus { background: radial-gradient(circle at 35% 35%, #b8e8e8, #1a8a8a); }
.orb-neptune { background: radial-gradient(circle at 35% 35%, #5b7fdb, #1a2d6b); }

.sun-center {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ffe600 20%, #ff8c00 60%, #ff4500 100%);
  box-shadow: 0 0 40px #ff8c00, 0 0 80px rgba(255,140,0,0.4);
  margin: 20px auto;
  animation: sunPulse 3s ease-in-out infinite;
}

@keyframes sunPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px #ff8c00, 0 0 80px rgba(255,140,0,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px #ff8c00, 0 0 120px rgba(255,140,0,0.5); }
}

.intro-text {
  text-align: center;
  color: var(--chalk-dim);
  line-height: 1.7;
  font-size: 0.95rem;
  margin-bottom: 10px;
}

/* ========== GAME BOARD ========== */
.board-container {
  position: relative;
  margin: 10px 0;
}

.board-tiles {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.board-tile {
  aspect-ratio: 1;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-family: var(--font-display);
  background: var(--bg-panel-2);
  border: 2px solid transparent;
  position: relative;
  transition: all 0.3s ease;
}

.board-tile.completed {
  background: var(--absorb-dim);
  border-color: var(--absorb);
}

.board-tile.current {
  background: var(--gold);
  color: #33150A;
  border-color: var(--gold);
  animation: tilePulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 20px rgba(255,209,102,0.4);
}

.board-tile.locked {
  opacity: 0.4;
}

.board-tile.special {
  background: var(--bg-panel);
  border-color: var(--purple);
}

@keyframes tilePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.tile-icon { font-size: 1.2rem; }
.tile-num {
  position: absolute;
  top: 2px; right: 6px;
  font-size: 0.65rem;
  color: var(--chalk-dim);
}

/* Token */
.player-token {
  position: absolute;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gold);
  border: 3px solid #fff;
  box-shadow: 0 0 12px rgba(255,209,102,0.7);
  z-index: 5;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ========== DIALOGUE ========== */
.dialogue { display: flex; flex-direction: column; gap: 12px; }
.bubble {
  background: var(--bg-panel-2);
  border-radius: 14px;
  padding: 12px 14px;
  position: relative;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .35s ease, transform .35s ease;
}
.bubble.show { opacity: 1; transform: translateY(0); }
.bubble .who {
  font-family: var(--font-display);
  font-size: 0.9rem;
  display: block;
  margin-bottom: 4px;
}
.bubble p { margin: 0; font-size: 1rem; line-height: 1.5; }
.bubble.npc-b { border-left: 4px solid var(--absorb); }
.bubble.npc-b .who { color: var(--absorb); }
.bubble.player-b { border-left: 4px solid var(--gold); margin-left: 18px; }
.bubble.player-b .who { color: var(--gold); }
.bubble.enemy-b { border-left: 4px solid var(--danger); }
.bubble.enemy-b .who { color: var(--danger); }

/* ========== QUEST ========== */
.quest-header { display: flex; justify-content: space-between; align-items: center; }

.quest-badge {
  background: var(--bg-panel-2);
  color: var(--gold);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-family: var(--font-display);
}

.quest-badge.score { color: var(--absorb); }

.quest-text {
  font-size: 1.1rem;
  line-height: 1.7;
}

.quest-text .highlight {
  color: var(--gold);
  font-weight: 700;
}

.quest-text .underline-subj {
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
  font-weight: 700;
  color: var(--absorb);
}

/* ========== CHOICES ========== */
.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.choice-grid.cols-1 { grid-template-columns: 1fr; }

.choice-btn {
  background: var(--bg-panel-2);
  color: var(--chalk);
  padding: 14px 12px;
  border-radius: 12px;
  font-size: 0.98rem;
  border: 2px solid transparent;
  text-align: left;
  line-height: 1.4;
}

.choice-btn:hover { border-color: var(--chalk-dim); }

.choice-btn.selected { border-color: var(--gold); background: var(--bg-panel); }
.choice-btn.correct { border-color: var(--absorb); background: var(--absorb-dim); }
.choice-btn.wrong { border-color: var(--danger); background: #4a2426; }

/* ========== TIMER ========== */
.timer-bar-wrap {
  height: 8px;
  background: var(--bg-panel-2);
  border-radius: 6px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: var(--absorb);
  width: 100%;
  transition: width 1s linear;
}

.timer-bar.warning { background: var(--release); }
.timer-bar.danger { background: var(--danger); }

.timer-label {
  font-family: var(--font-display);
  font-size: 1.2rem;
  text-align: center;
  color: var(--gold);
}

/* ========== CLASSIFY QUESTION ========== */
.classify-zone {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 12px 0;
}

.classify-bucket {
  flex: 1;
  min-width: 200px;
  min-height: 100px;
  background: var(--bg-panel-2);
  border: 2px dashed var(--chalk-dim);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  transition: all 0.3s ease;
}

.classify-bucket.dragover {
  border-color: var(--gold);
  background: rgba(255,209,102,0.1);
}

.classify-bucket h4 {
  font-family: var(--font-display);
  color: var(--gold);
  margin-bottom: 8px;
  font-size: 0.95rem;
}

.draggable-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}

.drag-item {
  background: var(--bg-panel);
  border: 2px solid var(--chalk-dim);
  border-radius: 20px;
  padding: 8px 16px;
  cursor: grab;
  font-size: 0.9rem;
  user-select: none;
  transition: all 0.2s ease;
}

.drag-item:active { cursor: grabbing; transform: scale(1.05); }

.drag-item.placed {
  opacity: 0.5;
  border-color: var(--absorb);
}

.bucket-item {
  background: var(--bg-panel);
  border: 1px solid var(--chalk-dim);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 0.85rem;
  margin: 4px;
  display: inline-block;
  cursor: pointer;
  transition: all 0.2s ease;
}

.bucket-item:hover { border-color: var(--danger); }

/* ========== SORT QUESTION ========== */
.sort-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 12px 0;
}

.sort-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-panel-2);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 12px 14px;
  cursor: grab;
  transition: all 0.2s ease;
  user-select: none;
}

.sort-item:active { cursor: grabbing; }
.sort-item.dragging { opacity: 0.4; }
.sort-item.over { border-color: var(--gold); }

.sort-num {
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: var(--gold);
  min-width: 28px;
}

.sort-label { flex: 1; }

.sort-handle {
  color: var(--chalk-dim);
  font-size: 1.2rem;
}

/* ========== TRUE/FALSE ========== */
.tf-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.tf-btn {
  padding: 18px;
  font-size: 1.3rem;
  font-family: var(--font-display);
  border-radius: 14px;
}

.tf-btn.true-btn { background: var(--absorb-dim); color: var(--chalk); border: 2px solid transparent; }
.tf-btn.true-btn:hover { border-color: var(--absorb); }
.tf-btn.false-btn { background: #4a2426; color: var(--chalk); border: 2px solid transparent; }
.tf-btn.false-btn:hover { border-color: var(--danger); }
.tf-btn.correct { border-color: var(--absorb); background: var(--absorb); color: #0B211D; }
.tf-btn.wrong { border-color: var(--danger); background: var(--danger); color: #3a1113; }

/* ========== INPUT QUESTION ========== */
.input-row {
  display: flex;
  gap: 10px;
  margin: 12px 0;
}

.input-row input {
  flex: 1;
  font-family: var(--font-body);
  background: var(--bg-panel-2);
  border: 2px solid var(--bg-panel-2);
  color: var(--chalk);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 1rem;
}
.input-row input:focus { outline: none; border-color: var(--absorb); }

/* ========== EXPLANATION ========== */
.explanation {
  background: var(--bg-panel-2);
  border-left: 4px solid var(--absorb);
  border-radius: 0 12px 12px 0;
  padding: 14px 16px;
  margin-top: 12px;
  animation: fadeIn 0.3s ease;
}

.explanation h4 {
  font-family: var(--font-display);
  color: var(--absorb);
  margin-bottom: 6px;
  font-size: 0.95rem;
}

.explanation p {
  color: var(--chalk-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}

.explanation .fact-tag {
  display: inline-block;
  background: rgba(95,211,196,0.15);
  border: 1px solid rgba(95,211,196,0.3);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.78rem;
  margin: 4px 4px 0 0;
  color: var(--absorb);
}

/* ========== RESULT ========== */
.result-score {
  font-family: var(--font-display);
  font-size: 3rem;
  text-align: center;
  color: var(--gold);
}

.result-headline {
  font-family: var(--font-display);
  font-size: 1.3rem;
  margin: 6px 0 0;
}
.result-headline strong { color: var(--gold); font-size: 1.6rem; }

.wrong-item {
  background: var(--bg-panel-2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 0.92rem;
}
.wrong-item .tag-correct { color: var(--absorb); font-weight: 700; }
.wrong-item .tag-wrong { color: var(--danger); font-weight: 700; text-decoration: line-through; }

/* ========== PRAISE OVERLAY ========== */
.praise-overlay {
  position: fixed; inset: 0;
  background: rgba(11,22,40,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}
.praise-card { text-align: center; }
.thumb { font-size: 5rem; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from { transform: scale(0.3) rotate(-15deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.praise-text {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--gold);
  margin-top: 8px;
}

/* ========== FIGHT SCREEN ========== */
.fight-header {
  text-align: center;
  margin-bottom: 8px;
}

.fight-stage {
  font-family: var(--font-display);
  font-size: 0.9rem;
  color: var(--chalk-dim);
}

.fight-round {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--gold);
}

.fighters {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0;
}

.fighter-col { text-align: center; }

.fighter-orb {
  width: 80px; height: 80px;
  border-radius: 50%;
  margin: 0 auto 8px;
  position: relative;
  transition: all 0.3s ease;
}

.fighter-orb.shake { animation: shake 0.4s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.fighter-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
}

.fighter-hp-mini {
  font-size: 0.8rem;
  color: var(--chalk-dim);
  margin-top: 2px;
}

.fighter-hp-bar {
  width: 100px; height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  margin: 4px auto 0;
  overflow: hidden;
}

.fighter-hp-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

.fighter-hp-fill.player { background: var(--absorb); }
.fighter-hp-fill.enemy { background: var(--danger); }

.vs-text {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--gold);
  animation: vsPulse 1.5s ease-in-out infinite;
}

@keyframes vsPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* ========== PROGRESS BAR ========== */
.progress-wrap {
  height: 6px;
  background: var(--bg-panel-2);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--absorb), var(--gold));
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* ========== FOOTER ========== */
#app-footer {
  margin-top: auto;
  padding: 26px 0 6px;
  text-align: center;
}

.copyright {
  margin: 12px 0 0;
  font-size: 0.78rem;
  color: var(--chalk-dim);
  opacity: .7;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 420px) {
  .choice-grid:not(.cols-1) { grid-template-columns: 1fr; }
  .title-block h1 { font-size: 1.7rem; }
  .fighters { gap: 10px; }
  .fighter-orb { width: 60px; height: 60px; }
}

@media (prefers-reduced-motion: reduce) {
  .screen { animation: none; }
  .bubble { opacity: 1; transform: none; transition: none; }
  .fighter-orb.shake { animation: none; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div id="app">
  <main id="screen"></main>
  <footer id="app-footer">
    <p class="copyright">오현중학교 1학년 과학</p>
  </footer>
</div>

<div id="praise-overlay" class="praise-overlay hidden">
  <div class="praise-card">
    <div class="thumb" id="praise-icon"></div>
    <div class="praise-text" id="praise-text"></div>
  </div>
</div>

<script>
// ============================================================
// STARFIELD
// ============================================================
(function initStars() {
  const c = document.getElementById('starfield');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.2 + 0.3,
        sp: Math.random() * 0.15 + 0.02,
        a: Math.random(),
        da: Math.random() * 0.015 + 0.003
      });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0.15) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
      s.y -= s.sp;
      if (s.y < -5) { s.y = c.height + 5; s.x = Math.random() * c.width; }
    });
    requestAnimationFrame(draw);
  }
  resize();
  draw();
  window.addEventListener('resize', resize);
})();

// ============================================================
// PLANET DATA
// ============================================================
const PLANETS = [

function showScreen(html) {
  screen.innerHTML = html;
  screen.className = 'screen';
  // Animate bubbles
  setTimeout(() => {
    document.querySelectorAll('.bubble').forEach((b, i) => {
      setTimeout(() => b.classList.add('show'), i * 400);
    });
  }, 50);
}

function showPraise(icon, text, dur=1200) {
  $('praise-icon').textContent = icon;
  $('praise-text').textContent = text;
  $('praise-overlay').classList.remove('hidden');
  setTimeout(() => $('praise-overlay').classList.add('hidden'), dur);
}

      행성, 왜소행성, 항성, 위성의 특징을 배틀로 익힙니다.
    </div>
    <div class="panel" style="text-align:center;">
      <div style="margin-bottom:14px;">
        <label style="display:block;margin-bottom:6px;color:var(--chalk-dim);font-size:0.9rem;">탐험가 이름</label>
        <input type="text" id="nameInput" value="탐험가" maxlength="10"
          style="max-width:200px;text-align:center;font-size:1.1rem;">
      </div>
      <button class="btn-primary" onclick="startGame()" style="width:100%;max-width:300px;">
        게임 시작
      </button>
    </div>
  `);
}

function startGame() {
  G.playerName = $('nameInput').value.trim() || '탐험가';
  G.currentQ = 0;
  G.score = 0;
  G.wrongAnswers = [];
  G.hp = 100;
  G.boardPosition = 0;
  G.round = 0;
  shuffleArray(QUESTIONS);
  renderIntroDialogue();
}

// ============================================================
// INTRO DIALOGUE
// ============================================================
function renderIntroDialogue() {
  G.screen = 'intro';
  showScreen(`
    <div class="panel">
      <div class="dialogue" id="dialogue">
        <div class="bubble npc-b">
          <span class="who">수성 탐험선 AI</span>
          <p>안녕하세요, ${G.playerName}님! 태양계 탐험에 오신 것을 환영합니다.</p>
        </div>
        <div class="bubble player-b">
          <span class="who">${G.playerName}</span>
          <p>태양계의 행성들을 직접 만나볼 수 있다고?</p>
        </div>
        <div class="bubble npc-b">
          <span class="who">수성 탐험선 AI</span>
          <p>네! 태양계의 8개 행성, 왜소행성, 항성까지... 퀴즈를 풀면서 배틀에서 승리하세요!</p>
        </div>
        <div class="bubble npc-b">
          <span class="who">수성 탐험선 AI</span>
          <p>각 퀴즈를 맞추면 점수를 얻고, 틀리면 설명을 통해 배울 수 있어요. 준비되셨나요?</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;">
      <button class="btn-primary" onclick="renderBoard()">탐험 시작!</button>
    </div>
  `);
}

// ============================================================
// GAME BOARD
// ============================================================
function renderBoard() {
  G.screen = 'board';
  const total = QUESTIONS.length;
  const cols = 6;
  const rows = Math.ceil(total / cols);

  let tilesHTML = '';
  for (let i = 0; i < total; i++) {
    const q = QUESTIONS[i];
    const isCompleted = i < G.boardPosition;
    const isCurrent = i === G.boardPosition;
    const isLocked = i > G.boardPosition;
    let cls = 'board-tile';
    let icon = '';
    if (isCompleted) { cls += ' completed'; icon = '✓'; }
    else if (isCurrent) { cls += ' current'; icon = '★'; }
    else { cls += ' locked'; icon = '🔒'; }

    if (q.type === 'classify') icon = '📦';
    else if (q.type === 'sort') icon = '🔢';
    else if (q.type === 'ox') icon = '⭕';
    else if (q.type === 'input') icon = '✏️';
    else if (q.type === 'mcq') icon = '❓';

    tilesHTML += `<div class="${cls}"><span class="tile-icon">${icon}</span><span class="tile-num">${i+1}</span></div>`;
  }

  showScreen(`
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span class="eyebrow">BOARD</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" style="width:${G.boardPosition/total*100}%"></div>
      </div>
      <div class="board-container">
        <div class="board-tiles">${tilesHTML}</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        ${G.boardPosition < total
          ? `<p style="color:var(--chalk-dim);margin-bottom:10px;">다음: 문제 ${G.boardPosition+1} / ${total}</p>
             <button class="btn-primary" onclick="nextQuestion()">퀴즈 풀기</button>`
          : `<p style="color:var(--gold);font-family:var(--font-display);font-size:1.2rem;margin-bottom:10px;">모든 퀴즈 완료!</p>
             <button class="btn-warm" onclick="renderResult()">최종 결과 보기</button>`
        }
      </div>
    </div>
  `);
}

// ============================================================
// QUESTION RENDERING
// ============================================================
function nextQuestion() {
  if (G.boardPosition >= QUESTIONS.length) { renderResult(); return; }
  const q = QUESTIONS[G.boardPosition];
  G.answered = false;
  G.timeLeft = 15;

  switch(q.type) {
    case 'mcq': renderMCQ(q); break;
    case 'ox': renderOX(q); break;
    case 'classify': renderClassify(q); break;
    case 'sort': renderSort(q); break;
    case 'input': renderInput(q); break;
  }

  startTimer();
}

function startTimer() {
  clearInterval(G.timer);
  G.timeLeft = 15;
  updateTimerDisplay();
  G.timer = setInterval(() => {
    G.timeLeft--;
    updateTimerDisplay();
    if (G.timeLeft <= 0) {
      clearInterval(G.timer);
      if (!G.answered) timeUp();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const bar = $('timerBar');
  const label = $('timerLabel');
  if (!bar || !label) return;
  const pct = (G.timeLeft / 15) * 100;
  bar.style.width = pct + '%';
  label.textContent = G.timeLeft + '초';
  bar.className = 'timer-bar' + (G.timeLeft <= 5 ? ' danger' : G.timeLeft <= 8 ? ' warning' : '');
}

function timeUp() {
  G.answered = true;
  const q = QUESTIONS[G.boardPosition];
  G.wrongAnswers.push({ q: q.q, correct: getCorrectAnswerText(q), your: '시간 초과' });
  showExplanation(q, false);
}

function getCorrectAnswerText(q) {
  if (q.type === 'mcq') return q.choices[q.answer];
  if (q.type === 'ox') return q.answer ? 'O (맞음)' : 'X (틀림)';
  if (q.type === 'classify') return '분류 참조';
  if (q.type === 'sort') return q.correct.join(' → ');
  if (q.type === 'input') return q.answer[0];
  return '';
}

// --- MCQ ---
function renderMCQ(q) {
  showScreen(`
    <div class="panel">
      <div class="quest-header">
        <span class="eyebrow">퀴즈 ${G.boardPosition+1}/${QUESTIONS.length}</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel">15초</div>
      <div class="quest-text" style="margin:14px 0;">${q.q}</div>
      <div class="choice-grid" id="choices">
        ${q.choices.map((c,i) => `<button class="choice-btn" onclick="answerMCQ(${i})">${c}</button>`).join('')}
      </div>
      <div id="explanation"></div>
    </div>
  `);
}

function answerMCQ(idx) {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = QUESTIONS[G.boardPosition];
  const correct = idx === q.answer;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => {
    if (i === q.answer) b.classList.add('correct');
    else if (i === idx && !correct) b.classList.add('wrong');
    b.onclick = null;
  });
  if (correct) { G.score += 10; showPraise('🎉', '정답!'); }
  else { G.wrongAnswers.push({ q: q.q, correct: q.choices[q.answer], your: q.choices[idx] }); }
  showExplanation(q, correct);
}

// --- OX ---
function renderOX(q) {
  showScreen(`
    <div class="panel">
      <div class="quest-header">
        <span class="eyebrow">퀴즈 ${G.boardPosition+1}/${QUESTIONS.length}</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel">15초</div>
      <div class="quest-text" style="margin:14px 0;">${q.q}</div>
      <div class="tf-grid" id="tfGrid">
        <button class="tf-btn true-btn" onclick="answerOX(true)">O (맞음)</button>
        <button class="tf-btn false-btn" onclick="answerOX(false)">X (틀림)</button>
      </div>
      <div id="explanation"></div>
    </div>
  `);
}

function answerOX(val) {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = QUESTIONS[G.boardPosition];
  const correct = val === q.answer;
  const btns = document.querySelectorAll('.tf-btn');
  btns.forEach(b => {
    const isTrue = b.classList.contains('true-btn');
    if ((isTrue && q.answer) || (!isTrue && !q.answer)) b.classList.add('correct');
    else if ((isTrue && val) || (!isTrue && !val)) b.classList.add('wrong');
    b.onclick = null;
  });
  if (correct) { G.score += 10; showPraise('✨', '정답!'); }
  else { G.wrongAnswers.push({ q: q.q, correct: q.answer ? 'O' : 'X', your: val ? 'O' : 'X' }); }
  showExplanation(q, correct);
}

// --- CLASSIFY ---
function renderClassify(q) {
  const shuffled = shuffleArray([...q.items]);
  window._classifyState = { placed: {}, items: shuffled };

  const bucketKeys = Object.keys(q.buckets);
  let bucketsHTML = bucketKeys.map(k =>
    `<div class="classify-bucket" id="bucket-${k}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropItem(event,'${k}')">
      <h4>${k}</h4><div id="bucketItems-${k}"></div>
    </div>`
  ).join('');

  let itemsHTML = shuffled.map(item =>
    `<div class="drag-item" draggable="true" data-item="${item}" ondragstart="event.dataTransfer.setData('text','${item}')">${item}</div>`
  ).join('');

  showScreen(`
    <div class="panel">
      <div class="quest-header">
        <span class="eyebrow">퀴즈 ${G.boardPosition+1}/${QUESTIONS.length}</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel">15초</div>
      <div class="quest-text" style="margin:14px 0;">${q.q}</div>
      <div class="draggable-items" id="dragItems">${itemsHTML}</div>
      <div class="classify-zone">${bucketsHTML}</div>
      <div style="text-align:center;margin-top:10px;">
        <button class="btn-primary" onclick="checkClassify()">제출</button>
      </div>
      <div id="explanation"></div>
    </div>
  `);
}

function dropItem(e, bucket) {
  e.preventDefault();
  const item = e.dataTransfer.getData('text');
  const bucketEl = document.getElementById('bucket-' + bucket);
  bucketEl.classList.remove('dragover');

  // Remove from previous bucket if any
  Object.keys(window._classifyState.placed).forEach(k => {
    if (window._classifyState.placed[k] === item) {
      delete window._classifyState.placed[k];
      const prevContainer = document.getElementById('bucketItems-' + k);
      const prevEl = prevContainer?.querySelector(`[data-item="${item}"]`);
      if (prevEl) prevEl.remove();
    }
  });

  // Check if item already placed in this bucket (remove duplicate)
  const container = document.getElementById('bucketItems-' + bucket);
  const existing = container.querySelector(`[data-item="${item}"]`);
  if (existing) existing.remove();

  // Add item to bucket
  window._classifyState.placed[item] = bucket;
  const chip = document.createElement('div');
  chip.className = 'bucket-item';
  chip.textContent = item;
  chip.dataset.item = item;
  chip.onclick = function() {
    this.remove();
    delete window._classifyState.placed[item];
    // Re-enable drag item
    document.querySelector(`.drag-item[data-item="${item}"]`)?.classList.remove('placed');
  };
  container.appendChild(chip);

  // Mark drag item as placed
  document.querySelector(`.drag-item[data-item="${item}"]`)?.classList.add('placed');
}

function checkClassify() {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = QUESTIONS[G.boardPosition];
  let correctCount = 0;
  const totalItems = q.items.length;

  q.items.forEach(item => {
    // Find which bucket it's in
    const placedBucket = window._classifyState.placed[item];
    // Find correct bucket
    let correctBucket = null;
    for (const [k, v] of Object.entries(q.buckets)) {
      if (v.includes(item)) { correctBucket = k; break; }
    }
    if (placedBucket === correctBucket) correctCount++;
  });

  const allCorrect = correctCount === totalItems;
  if (allCorrect) { G.score += 15; showPraise('🏆', '완벽 분류!'); }
  else if (correctCount >= totalItems * 0.5) { G.score += 5; showPraise('👍', `부분 정답 (${correctCount}/${totalItems})`); }
  else { G.wrongAnswers.push({ q: q.q, correct: '분류 참조', your: `${correctCount}/${totalItems} 정답` }); }
  showExplanation(q, allCorrect);
}

// --- SORT ---
function renderSort(q) {
  const shuffled = shuffleArray([...q.items]);
  window._sortState = shuffled;

  function renderSortList() {
    const container = $('sortList');
    if (!container) return;
    container.innerHTML = window._sortState.map((item, i) =>
      `<div class="sort-item" draggable="true" data-idx="${i}"
        ondragstart="event.dataTransfer.setData('idx','${i}');this.classList.add('dragging')"
        ondragend="this.classList.remove('dragging')"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="sortSwap(event,${i})">
        <span class="sort-num">${i+1}</span>
        <span class="sort-label">${item}</span>
        <span class="sort-handle">☰</span>
      </div>`
    ).join('');
  }

  window._renderSortList = renderSortList;

  showScreen(`
    <div class="panel">
      <div class="quest-header">
        <span class="eyebrow">퀴즈 ${G.boardPosition+1}/${QUESTIONS.length}</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel">15초</div>
      <div class="quest-text" style="margin:14px 0;">${q.q}<br><small style="color:var(--chalk-dim);">(드래그로 순서를 바꾸세요)</small></div>
      <div class="sort-list" id="sortList"></div>
      <div style="text-align:center;margin-top:10px;">
        <button class="btn-primary" onclick="checkSort()">제출</button>
      </div>
      <div id="explanation"></div>
    </div>
  `);
  renderSortList();
}

function sortSwap(e, targetIdx) {
  e.preventDefault();
  const fromIdx = parseInt(e.dataTransfer.getData('idx'));
  if (isNaN(fromIdx) || fromIdx === targetIdx) return;
  const arr = window._sortState;
  const temp = arr[fromIdx];
  arr[fromIdx] = arr[targetIdx];
  arr[targetIdx] = temp;
  window._renderSortList();
}

function checkSort() {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = QUESTIONS[G.boardPosition];
  const userOrder = window._sortState;
  const correct = JSON.stringify(userOrder) === JSON.stringify(q.correct);

  if (correct) { G.score += 15; showPraise('🌟', '완벽 순서!'); }
  else { G.wrongAnswers.push({ q: q.q, correct: q.correct.join(' → '), your: userOrder.join(' → ') }); }
  showExplanation(q, correct);
}

// --- INPUT ---
function renderInput(q) {
  showScreen(`
    <div class="panel">
      <div class="quest-header">
        <span class="eyebrow">퀴즈 ${G.boardPosition+1}/${QUESTIONS.length}</span>
        <span class="quest-badge score">점수: ${G.score}</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel">15초</div>
      <div class="quest-text" style="margin:14px 0;">${q.q}</div>
      <div class="input-row">
        <input type="text" id="answerInput" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter')checkInput()">
        <button class="btn-primary" onclick="checkInput()">제출</button>
      </div>
      <div id="explanation"></div>
    </div>
  `);
  $('answerInput').focus();
}

function checkInput() {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = QUESTIONS[G.boardPosition];
  const userAns = ($('answerInput')?.value || '').trim();
  const correct = q.answer.some(a => userAns === a || userAns.replace(/\s/g,'') === a.replace(/\s/g,''));

  if (correct) { G.score += 15; showPraise('💡', '정답!'); }
  else { G.wrongAnswers.push({ q: q.q, correct: q.answer[0], your: userAns || '(미입력)' }); }
  showExplanation(q, correct);
}

// ============================================================
// EXPLANATION
// ============================================================
function showExplanation(q, correct) {
  const el = $('explanation');
  if (!el) return;
  el.innerHTML = `
    <div class="explanation">
      <h4>${correct ? '✅ 정답!' : '❌ 오답'}</h4>
      <p>${q.explain}</p>
      <div style="margin-top:8px;">
        ${(q.tags||[]).map(t => `<span class="fact-tag">${t}</span>`).join('')}
      </div>
    </div>
    <div style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn-primary" onclick="advanceBoard()">다음 문제 →</button>
      <button class="btn-secondary" onclick="goToBoard()" style="font-size:0.85rem;padding:10px 18px;">보드로 돌아가기</button>
    </div>
  `;
}

function advanceBoard() {
  G.boardPosition++;
  if (G.boardPosition >= QUESTIONS.length) {
    renderResult();
  } else {
    nextQuestion();
  }
}

function goToBoard() {
  renderBoard();
}

// ============================================================
// RESULT SCREEN
// ============================================================
function renderResult() {
  G.screen = 'result';
  const pct = Math.round(G.score / 215 * 100);
  let grade = '';
  let gradeIcon = '';
  if (pct >= 90) { grade = '태양계 마스터!'; gradeIcon = '🏆'; }
  else if (pct >= 70) { grade = '행성 전문가!'; gradeIcon = '🌟'; }
  else if (pct >= 50) { grade = '탐험가'; gradeIcon = '🚀'; }
  else { grade = '초보 탐험가'; gradeIcon = '🔭'; }

  let wrongHTML = '';
  if (G.wrongAnswers.length > 0) {
    wrongHTML = `<div class="panel">
      <h3 style="font-family:var(--font-display);color:var(--danger);margin-bottom:12px;">오답 노트</h3>
      ${G.wrongAnswers.map(w => `
        <div class="wrong-item">
          <p style="margin-bottom:6px;">${w.q}</p>
          <p><span class="tag-wrong">내 답: ${w.your}</span></p>
          <p><span class="tag-correct">정답: ${w.correct}</span></p>
        </div>
      `).join('')}
    </div>`;
  }

  // Facts summary
  const allFacts = [...PLANETS, SUN, ...DWARFS].flatMap(p => p.facts.slice(0, 2).map(f => ({ planet: p.name, fact: f })));
  const randomFacts = shuffleArray(allFacts).slice(0, 6);

  showScreen(`
    <div class="panel" style="text-align:center;">
      <div style="font-size:4rem;margin-bottom:10px;">${gradeIcon}</div>
      <h2 style="font-family:var(--font-display);color:var(--gold);font-size:1.6rem;margin-bottom:6px;">${grade}</h2>
      <div class="result-score">${G.score}점</div>
      <div class="result-headline">${G.playerName}의 태양계 탐험 결과</div>
    </div>

    <div class="panel">
      <h3 style="font-family:var(--font-display);color:var(--absorb);margin-bottom:12px;">.nasa 알려주는 태양계 상식</h3>
      ${randomFacts.map(f => `
        <div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.9rem;color:var(--chalk-dim);">
          <strong style="color:var(--gold);">${f.planet}:</strong> ${f.fact}
        </div>
      `).join('')}
    </div>

    ${wrongHTML}

    <div style="text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn-secondary" onclick="renderStart()">메인으로</button>
      <button class="btn-primary" onclick="startGame()">다시 하기</button>
    </div>
  `);
}

// ============================================================
// UTILS
// ============================================================
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// INIT
// ============================================================
renderStart();
</script>
