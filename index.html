<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>상태변화 배틀 | 중학교 1학년 과학 4단원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B1628;
  --bg-panel: #12223D;
  --bg-panel-2: #1A2E50;
  --chalk: #E8EDF5;
  --chalk-dim: #8A9BB5;
  --absorb: #5FD3C4;
  --absorb-dim: #2A6B62;
  --release: #FF8A5C;
  --release-dim: #7A4B36;
  --gold: #FFD166;
  --danger: #FF6B6B;
  --purple: #B07CFF;
  --pink: #FF7CB5;
  --blue: #64B5F6;
  --font-display: 'Do Hyeon', sans-serif;
  --font-body: 'Noto Sans KR', sans-serif;
  --radius: 16px;
  --shadow: 0 8px 24px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--chalk); font-family: var(--font-body); min-height: 100vh; overscroll-behavior: none; }
body { background-image: radial-gradient(circle at 10% 15%, rgba(95,211,196,0.04) 0, transparent 35%), radial-gradient(circle at 90% 85%, rgba(176,124,255,0.04) 0, transparent 40%); }
#app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding: 0 12px; }

.title-block { text-align: center; padding: 24px 0 8px; }
.title-block h1 { font-family: var(--font-display); font-size: 2rem; color: var(--gold); text-shadow: 0 2px 12px rgba(255,209,102,0.25); }
.title-block p { color: var(--chalk-dim); margin: 0; font-size: 0.9rem; }

.card { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-top: 14px; }

.btn { display: inline-block; padding: 14px 32px; border: none; border-radius: 12px; font-family: var(--font-display); font-size: 1.1rem; cursor: pointer; transition: all 0.2s; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #FFAB40); color: #1a1a2e; box-shadow: 0 4px 16px rgba(255,209,102,0.3); }
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,209,102,0.4); }
.btn-blue { background: linear-gradient(135deg, var(--blue), #42A5F5); color: #fff; }
.btn-outline { background: transparent; border: 2px solid var(--chalk-dim); color: var(--chalk); }

.hp-bar-bg { background: #1a1a2e; border-radius: 8px; height: 18px; overflow: hidden; position: relative; }
.hp-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
.hp-bar-fill.green { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
.hp-bar-fill.red { background: linear-gradient(90deg, #f44336, #FF7043); }
.hp-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 0.7rem; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

.enemy-sprite { font-size: 4rem; text-align: center; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
@keyframes shake { 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
.shake { animation: shake 0.3s ease; }

.timer-bar { height: 6px; background: #1a1a2e; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.timer-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.1s linear; }

.choice-btn { display: block; width: 100%; padding: 14px 16px; margin: 8px 0; background: var(--bg-panel-2); border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; color: var(--chalk); font-size: 0.95rem; text-align: left; cursor: pointer; transition: all 0.15s; }
.choice-btn:hover { border-color: var(--gold); background: rgba(255,209,102,0.08); }
.choice-btn.correct { border-color: var(--absorb); background: rgba(95,211,196,0.12); }
.choice-btn.wrong { border-color: var(--danger); background: rgba(255,107,107,0.12); }

.ox-row { display: flex; gap: 12px; margin-top: 10px; }
.ox-btn { flex: 1; padding: 16px; border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; background: var(--bg-panel-2); color: var(--chalk); font-family: var(--font-display); font-size: 1.2rem; cursor: pointer; transition: all 0.15s; }
.ox-btn:hover { border-color: var(--gold); }
.ox-btn.correct { border-color: var(--absorb); background: rgba(95,211,196,0.12); }
.ox-btn.wrong { border-color: var(--danger); background: rgba(255,107,107,0.12); }

.input-row { display: flex; gap: 8px; margin-top: 10px; }
.input-row input { flex: 1; padding: 14px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; background: var(--bg-panel-2); color: var(--chalk); font-size: 1rem; font-family: var(--font-body); }
.input-row input:focus { outline: none; border-color: var(--gold); }

.tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; margin: 2px; background: rgba(255,255,255,0.06); color: var(--chalk-dim); }

.explanation { background: rgba(95,211,196,0.08); border: 1px solid rgba(95,211,196,0.2); border-radius: 12px; padding: 14px; margin-top: 10px; }
.explanation h4 { margin-bottom: 6px; }

.log-list { max-height: 120px; overflow-y: auto; font-size: 0.8rem; color: var(--chalk-dim); margin-top: 10px; }
.log-item { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }

.result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat-box { background: var(--bg-panel-2); border-radius: 12px; padding: 14px; text-align: center; }
.stat-box .num { font-family: var(--font-display); font-size: 1.5rem; color: var(--gold); }
.stat-box .label { font-size: 0.8rem; color: var(--chalk-dim); margin-top: 4px; }

.damage-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-family: var(--font-display); font-size: 2rem; color: var(--danger); pointer-events: none; z-index: 999; animation: popUp 0.8s ease forwards; text-shadow: 0 2px 8px rgba(255,0,0,0.4); }
.damage-popup.heal { color: var(--absorb); text-shadow: 0 2px 8px rgba(95,211,196,0.4); }
@keyframes popUp { 0%{ opacity:1; transform:translate(-50%,-50%) scale(0.5); } 50%{ opacity:1; transform:translate(-50%,-70%) scale(1.2); } 100%{ opacity:0; transform:translate(-50%,-90%) scale(1); } }

.praise { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 1.5rem; color: var(--gold); pointer-events: none; z-index: 998; animation: popUp 1s ease forwards; text-shadow: 0 2px 12px rgba(255,209,102,0.5); }

@media (max-width:480px) {
  .title-block h1 { font-size: 1.6rem; }
  .card { padding: 14px; }
  .enemy-sprite { font-size: 3rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = id => document.getElementById(id);

// ============================================================
// QUESTIONS - 중1 과학 4단원 상태변화 (20문제)
// ============================================================
const QUESTIONS = [
  // --- 객관식 (11문제 x 10점) ---
  { type:'mcq', q:'고체가 액체로 변하는 상태변화를 무엇이라 하나요?', choices:['응고','융해','기화','승화'], answer:1,
    explain:'융해는 고체가 열을 흡수하여 액체로 녹는 현상입니다. 예: 얼음이 물로 녹음', tags:['융해','상태변화'] },
  { type:'mcq', q:'액체가 고체로 변하는 상태변화를 무엇이라 하나요?', choices:['융해','기화','응고','승화'], answer:2,
    explain:'응고는 액체가 열을 방출하여 고체로 굳는 현상입니다. 예: 물이 얼음으로 얼음', tags:['응고','상태변화'] },
  { type:'mcq', q:'액체가 기체로 변하는 상태변화를 총칭하여 무엇이라 하나요?', choices:['증발','융해','기화','액화'], answer:2,
    explain:'기화는 액체가 열을 흡수하여 기체로 바뀌는 현상으로, 증발과 끓음을 모두 포함합니다.', tags:['기화','상태변화'] },
  { type:'mcq', q:'기체가 액체로 변하는 상태변화를 무엇이라 하나요?', choices:['기화','융해','승화','액화'], answer:3,
    explain:'액화는 기체가 열을 방출하여 액체로 변하는 현상입니다. 예: 수증기가 물방울로 변함', tags:['액화','상태변화'] },
  { type:'mcq', q:'고체가 바로 기체로 변하는 상태변화를 무엇이라 하나요?', choices:['융해','응고','기화','승화'], answer:3,
    explain:'승화는 고체가 열을 흡수하여 액체를 거치지 않고 바로 기체로 바뀌는 현상입니다. 예: 드라이아이스', tags:['승화','상태변화'] },
  { type:'mcq', q:'물이 얼 때 주변 온도가 어떻게 변하나요?', choices:['온도가 낮아진다','온도가 높아진다','온도가 변하지 않는다','먼저 낮아졌다가 높아진다'], answer:1,
    explain:'물이 얼 때(응고)는 열을 방출하므로 주변 온도가 높아집니다.', tags:['응고','열의 방출'] },
  { type:'mcq', q:'다음 중 열을 흡수하는 상태변화가 아닌 것은?', choices:['융해','기화','승화','응고'], answer:3,
    explain:'응고는 열을 방출하는 변화입니다. 융해, 기화, 승화는 모두 열을 흡수합니다.', tags:['열의 흡수','열의 방출'] },
  { type:'mcq', q:'물이 끓을 때 기포가 생기는 이유는?', choices:['물이 오염되어서','물속에 녹아있던 공기가 나오기 때문','물이 분해되어서','산소가 들어가서'], answer:1,
    explain:'끓을 때 기포는 물속에 녹아있던 공기가 나오는 것과, 물이 기화하여 수증기 기포가 생긴 것입니다.', tags:['끓음','기화'] },
  { type:'mcq', q:'가열곡선에서 수평 구간은 무엇을 의미하나요?', choices:['온도가 계속 올라간다','상태변화가 일어나는 구간','열이 방출되는 구간','온도가 내려간다'], answer:1,
    explain:'가열곡선의 수평 구간은 융해(고체→액체) 또는 끓음(액체→기체)과 같은 상태변화가 일어나는 구간입니다.', tags:['가열곡선','상태변화'] },
  { type:'mcq', q:'증발과 끓음의 공통점은 무엇인가요?', choices:['모두 기화 현상이다','끓음만 기화 현상이다','증발은 고체에서 일어난다','온도 조건이 같다'], answer:0,
    explain:'증발과 끓음은 모두 액체가 기체로 변하는 기화 현상입니다. 차이점은 끓음은 일정한 온도(끓는점)에서 일어납니다.', tags:['증발','끓음','기화'] },
  { type:'mcq', q:'다음 중 열을 방출하는 상태변화가 아닌 것은?', choices:['응고','액화','융해','승화'], answer:2,
    explain:'융해(고체→액체)는 열을 흡수하는 변화입니다. 응고, 액화는 열을 방출합니다.', tags:['열의 방출','상태변화'] },
  // --- OX (5문제 x 10점) ---
  { type:'ox', q:'증발은 액체의 표면에서만 일어나지만, 끓음은 액체의 내부와 표면 모두에서 일어난다.', answer:true,
    explain:'증발은 표면에서만 천천히 일어나지만, 끓음은 일정한 온도에서 내부와 표면 모두에서 빠르게 일어납니다.', tags:['증발','끓음'] },
  { type:'ox', q:'얼음이 녹을 때 주변 온도가 낮아진다.', answer:false,
    explain:'얼음이 녹을 때(융해)는 주변에서 열을 흡수하므로 주변 온도가 낮아집니다.', tags:['융해','열의 흡수'] },
  { type:'ox', q:'가열곡선에서 수평 구간의 길이가 길수록 더 많은 열이 필요하다.', answer:true,
    explain:'수평 구간이 길다는 것은 상태변화에 더 많은 열(잠열)이 필요하다는 의미입니다.', tags:['가열곡선','잠열'] },
  { type:'ox', q:'증발은 끓음보다 느리게 일어난다.', answer:true,
    explain:'증발은 액체 표면에서 천천히 일어나지만, 끓음은 일정한 온도에서 내부와 표면에서 동시에 빠르게 일어납니다.', tags:['증발','끓음'] },
  { type:'ox', q:'끓는점에서 액체가 모두 기체로 될 때까지 온도가 계속 올라간다.', answer:false,
    explain:'끓는점에 도달하면 액체가 기화하는 동안 온도가 변하지 않습니다. 모든 액체가 기화한 후에야 온도가 올라갑니다.', tags:['끓음','가열곡선'] },
  // --- 단답형 (4문제 x 15점) ---
  { type:'input', q:'상태변화가 일어날 때 흡수하거나 방출하는 열량을 "___"이라 합니다.', answer:['잠열'],
    explain:'잠열은 상태변화가 일어날 때 온도의 변화 없이 흡수하거나 방출하는 열량입니다.', tags:['잠열','상태변화'] },
  { type:'input', q:'액체가 기체로 변할 때, 액체 내부와 표면에서 동시에 기체가 되는 현상을 "___"이라 합니다.', answer:['끓음'],
    explain:'끓음은 액체가 일정한 온도(끓는점)에서 내부와 표면에서 동시에 기화하는 현상입니다.', tags:['끓음','기화'] },
  { type:'input', q:'고체가 열을 흡수하여 액체를 거치지 않고 바로 기체로 변하는 현상은?', answer:['승화'],
    explain:'승화는 고체가 열을 흡수하여 액체를 거치지 않고 바로 기체로 변하는 현상입니다.', tags:['승화','상태변화'] },
  { type:'input', q:'액체가 기체로 변할 때, 액체의 표면에서만 천천히 일어나는 현상을 "___"이라 합니다.', answer:['증발'],
    explain:'증발은 액체의 표면에서만 천천히 일어나는 기화 현상입니다.', tags:['증발','기화'] },
];

// ============================================================
// GAME STATE
// ============================================================
let G = {
  screen: 'start',
  playerName: '학생',
  currentQ: 0,
  score: 0,
  combo: 0,
  maxCombo: 0,
  totalCorrect: 0,
  playerHp: 500,
  playerMaxHp: 500,
  enemyHp: 500,
  enemyMaxHp: 500,
  maxScore: 220,
  timer: null,
  timeLeft: 0,
  answered: false,
  wrongAnswers: [],
  shuffled: [],
};

// ============================================================
// UTIL
// ============================================================
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCorrectText(q) {
  if (q.type === 'mcq') return q.choices[q.answer];
  if (q.type === 'ox') return q.answer ? 'O' : 'X';
  return q.answer[0];
}

function showDamagePopup(dmg, isPlayer) {
  const el = document.createElement('div');
  el.className = 'damage-popup';
  el.textContent = (isPlayer ? '💥 -' : '🔥 -') + dmg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showHealPopup(heal) {
  const el = document.createElement('div');
  el.className = 'damage-popup heal';
  el.textContent = '💚 +' + heal;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showPraise(icon, text) {
  const el = document.createElement('div');
  el.className = 'praise';
  el.textContent = icon + ' ' + text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function addLog(type, msg) {
  const log = $('log-list');
  if (!log) return;
  const div = document.createElement('div');
  div.className = 'log-item';
  div.textContent = msg;
  log.prepend(div);
}

function startTimer() {
  G.timeLeft = 20;
  const fill = $('timer-fill');
  if (fill) fill.style.width = '100%';
  G.timer = setInterval(() => {
    G.timeLeft -= 0.1;
    if (fill) fill.style.width = Math.max(0, G.timeLeft / 20 * 100) + '%';
    if (G.timeLeft <= 0) {
      clearInterval(G.timer);
      handleAnswer(false, QUESTIONS[G.currentQ], '(시간 초과)');
    }
  }, 100);
}

// ============================================================
// SCREENS
// ============================================================
function renderStart() {
  G.screen = 'start';
  $('app').innerHTML = `
    <div class="title-block">
      <h1>⚡ 상태변화 배틀 ⚡</h1>
      <p>중학교 1학년 과학 4단원 | 물질의 상태변화</p>
    </div>
    <div class="card" style="text-align:center;">
      <div class="enemy-sprite">🤖</div>
      <h2 style="margin:10px 0 4px; color:var(--danger);">아이언맨</h2>
      <p style="color:var(--chalk-dim); font-size:0.9rem;">"흥! 20문제를 맞춰봐. 틀리면 내 레이저가 나갈걸?"</p>
      <div style="margin-top:20px;">
        <p style="color:var(--chalk-dim); font-size:0.85rem; margin-bottom:6px;">이름을 입력하세요</p>
        <div class="input-row">
          <input type="text" id="nameInput" placeholder="학생 이름" maxlength="10" value="학생">
          <button class="btn btn-gold" onclick="startBattle()">⚔️ 배틀 시작!</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:12px; font-size:0.85rem; color:var(--chalk-dim);">
      <p>📝 <strong>객관식 11문제</strong> (10점) + <strong>OX 5문제</strong> (10점) + <strong>단답형 4문제</strong> (15점)</p>
      <p style="margin-top:4px;">❤️ 내 HP: 500 | 🤖 아이언맨 HP: 500</p>
      <p style="margin-top:4px;">⏱️ 문제당 20초 | 🎯 정답 시 콤보로 더 많은 데미지!</p>
    </div>
  `;
}

function startBattle() {
  G.playerName = $('nameInput')?.value?.trim() || '학생';
  G.currentQ = 0;
  G.score = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.totalCorrect = 0;
  G.playerHp = 500;
  G.enemyHp = 500;
  G.wrongAnswers = [];
  G.shuffled = QUESTIONS;
  G.screen = 'battle';
  renderBattle();
}

function renderBattle() {
  const q = G.shuffled[G.currentQ];
  const qNum = G.currentQ + 1;
  const pPct = Math.max(0, G.playerHp / G.playerMaxHp * 100);
  const ePct = Math.max(0, G.enemyHp / G.enemyMaxHp * 100);

  let questionHTML = '';
  if (q.type === 'mcq') {
    questionHTML = q.choices.map((c, i) =>
      `<button class="choice-btn" onclick="checkMCQ(${i})">${String.fromCharCode(65+i)}. ${c}</button>`
    ).join('');
  } else if (q.type === 'ox') {
    questionHTML = `
      <div class="ox-row">
        <button class="ox-btn" onclick="checkOX(true)">⭕ O</button>
        <button class="ox-btn" onclick="checkOX(false)">❌ X</button>
      </div>`;
  } else {
    questionHTML = `
      <div class="input-row">
        <input type="text" id="answerInput" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter')checkInput()">
        <button class="btn btn-gold" onclick="checkInput()">확인</button>
      </div>`;
  }

  $('app').innerHTML = `
    <div class="title-block" style="padding:12px 0 4px;">
      <h1 style="font-size:1.4rem;">⚡ 상태변화 배틀 ⚡</h1>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:0.85rem; color:var(--chalk-dim);">문제 ${qNum} / ${G.shuffled.length}</span>
        <span style="font-size:0.85rem; color:var(--gold);">점수: ${G.score}</span>
        <span style="font-size:0.85rem; color:var(--purple);">콤보: x${G.combo}</span>
      </div>

      <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
        <div style="flex:1;">
          <div style="font-size:0.8rem; color:var(--chalk-dim); margin-bottom:3px;">🤖 아이언맨</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill red" style="width:${ePct}%"></div>
            <span class="hp-num" id="enemy-hp-num">${Math.max(0,G.enemyHp)}/${G.enemyMaxHp}</span>
          </div>
        </div>
        <div style="font-size:1.5rem;">⚡</div>
        <div style="flex:1;">
          <div style="font-size:0.8rem; color:var(--chalk-dim); margin-bottom:3px;">⚔️ ${G.playerName}</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill green" style="width:${pPct}%"></div>
            <span class="hp-num" id="player-hp-num">${Math.max(0,G.playerHp)}/${G.playerMaxHp}</span>
          </div>
        </div>
      </div>

      <div class="enemy-sprite" style="font-size:2.5rem;">🤖</div>
    </div>

    <div class="card">
      <p style="font-size:1rem; font-weight:500; line-height:1.6; margin-bottom:4px;">${q.q}</p>
      ${questionHTML}
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div id="explanation"></div>
    </div>

    <div class="card" style="margin-top:10px;">
      <div style="font-size:0.8rem; color:var(--chalk-dim); margin-bottom:4px;">戰場 로그</div>
      <div class="log-list" id="log-list"></div>
    </div>

    <div style="text-align:center; padding:20px 0; font-size:0.75rem; color:var(--chalk-dim);">오현중학교 1학년 과학 김보영</div>
  `;

  G.answered = false;
  startTimer();
}

function updateBattleHP() {
  const pPct = Math.max(0, G.playerHp / G.playerMaxHp * 100);
  const ePct = Math.max(0, G.enemyHp / G.enemyMaxHp * 100);
  const pFill = document.querySelector('.hp-bar-fill.green');
  const eFill = document.querySelector('.hp-bar-fill.red');
  const pNum = $('player-hp-num');
  const eNum = $('enemy-hp-num');
  if (pFill) pFill.style.width = pPct + '%';
  if (eFill) eFill.style.width = ePct + '%';
  if (pNum) pNum.textContent = `${Math.max(0,G.playerHp)}/${G.playerMaxHp}`;
  if (eNum) eNum.textContent = `${Math.max(0,G.enemyHp)}/${G.enemyMaxHp}`;
}

function playerAttackAnim() {
  const orb = $('enemy-orb');
  if (orb) { orb.classList.add('shake'); setTimeout(() => orb.classList.remove('shake'), 400); }
}

function enemyAttackAnim() {
  const orb = $('player-orb');
  if (orb) { orb.classList.add('shake'); setTimeout(() => orb.classList.remove('shake'), 400); }
}

// ============================================================
// ANSWER HANDLERS
// ============================================================
function checkMCQ(idx) {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = G.shuffled[G.currentQ];
  const correct = idx === q.answer;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => {
    if (i === q.answer) b.classList.add('correct');
    else if (i === idx && !correct) b.classList.add('wrong');
    b.style.pointerEvents = 'none';
  });
  handleAnswer(correct, q, q.choices[idx]);
}

function checkOX(val) {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = G.shuffled[G.currentQ];
  const correct = val === q.answer;
  const btns = document.querySelectorAll('.ox-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  handleAnswer(correct, q, val ? 'O' : 'X');
}

function checkInput() {
  if (G.answered) return;
  G.answered = true;
  clearInterval(G.timer);
  const q = G.shuffled[G.currentQ];
  const userAns = ($('answerInput')?.value || '').trim();
  const correct = q.answer.some(a => userAns === a || userAns.replace(/\s/g,'') === a.replace(/\s/g,''));
  handleAnswer(correct, q, userAns || '(미입력)');
}

function handleAnswer(correct, q, userAnswer) {
  if (correct) {
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.totalCorrect++;
    let dmg = 15 + G.combo * 3;
    G.enemyHp -= dmg;
    G.score += 10 + G.combo * 2;
    showDamagePopup(dmg, true);
    playerAttackAnim();
    addLog('dmg', `✅ 정답! ${dmg} 데미지! (콤보 x${G.combo})`);

    if (G.combo >= 3) {
      const heal = 5;
      G.playerHp = Math.min(G.playerMaxHp, G.playerHp + heal);
      showHealPopup(heal);
      addLog('heal', `🔥 콤보 보너스! HP +${heal}`);
    }

    if (G.combo >= 5) showPraise('🔥', `${G.combo}콤보! 대단해!`);
    else if (G.combo >= 3) showPraise('⚡', `${G.combo}콤보!`);
    else showPraise('✅', '정답!');
  } else {
    G.combo = 0;
    G.wrongAnswers.push({ q: q.q, correct: getCorrectText(q), your: userAnswer });
    let dmg = 8;
    G.playerHp -= dmg;
    showDamagePopup(dmg, false);
    enemyAttackAnim();
    addLog('dmg', `❌ 오답! 아이언맨의 공격! -${dmg}HP`);
  }

  updateBattleHP();

  if (G.enemyHp <= 0) {
    G.enemyHp = 0;
    updateBattleHP();
    setTimeout(() => renderResult(true), 800);
    return;
  }
  if (G.playerHp <= 0) {
    G.playerHp = 0;
    updateBattleHP();
    setTimeout(() => renderResult(false), 800);
    return;
  }

  showExplanation(q, correct);
}

function showExplanation(q, correct) {
  const el = $('explanation');
  if (!el) return;
  el.innerHTML = `
    <div class="explanation">
      <h4>${correct ? '✅ 정답!' : '❌ 오답'}</h4>
      <p>${q.explain}</p>
      <div style="margin-top:8px;">
        ${(q.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
    </div>
    <div style="text-align:center;margin-top:14px;">
      <button class="btn-gold" onclick="nextQuestion()" style="width:100%;max-width:300px;padding:12px;">
        ${G.currentQ < G.shuffled.length - 1 ? '다음 문제 →' : '결과 보기'}
      </button>
    </div>
  `;
}

function nextQuestion() {
  G.currentQ++;
  if (G.currentQ >= G.shuffled.length) {
    renderResult(G.enemyHp <= 0);
  } else {
    renderBattle();
  }
}

// ============================================================
// RESULT
// ============================================================
function renderResult(playerWon) {
  G.screen = 'result';
  clearInterval(G.timer);

  const pct = Math.round(G.score / G.maxScore * 100);
  let grade, gradeIcon;
  if (pct >= 90) { grade = '평가 끝! 아이언맨 제압!'; gradeIcon = '🏆'; }
  else if (pct >= 70) { grade = '대단한 실력!'; gradeIcon = '⭐'; }
  else if (pct >= 50) { grade = '분전했다!'; gradeIcon = '💪'; }
  else { grade = '다음엔 더 잘할 수 있어!'; gradeIcon = '📚'; }

  $('app').innerHTML = `
    <div class="title-block">
      <h1>${gradeIcon} ${grade}</h1>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:2rem; margin-bottom:8px;">${playerWon ? '🎉' : '😢'}</div>
      <h2 style="color:${playerWon ? 'var(--gold)' : 'var(--danger)'};">${playerWon ? '아이언맨을 제압했다!' : '아이언맨에게 패배...'}</h2>
      <div class="result-stats">
        <div class="stat-box"><div class="num">${G.score}</div><div class="label">총 점수</div></div>
        <div class="stat-box"><div class="num">${pct}%</div><div class="label">정답률</div></div>
        <div class="stat-box"><div class="num">${G.totalCorrect} / ${G.shuffled.length}</div><div class="label">맞힌 문제</div></div>
        <div class="stat-box"><div class="num">x${G.maxCombo}</div><div class="label">최대 콤보</div></div>
      </div>
      <div style="margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-gold" onclick="renderStart()">🔄 다시 하기</button>
      </div>
    </div>
    ${G.wrongAnswers.length > 0 ? `
    <div class="card">
      <h3 style="margin-bottom:8px;">❌ 틀린 문제 정리</h3>
      ${G.wrongAnswers.map(w => `
        <div style="margin-bottom:10px; padding:10px; background:var(--bg-panel-2); border-radius:10px;">
          <p style="font-size:0.9rem; font-weight:500;">${w.q}</p>
          <p style="font-size:0.85rem; color:var(--absorb); margin-top:4px;">정답: ${w.correct}</p>
          <p style="font-size:0.85rem; color:var(--danger);">내 답변: ${w.your}</p>
        </div>
      `).join('')}
    </div>` : ''}
    <div style="text-align:center; padding:20px 0; font-size:0.75rem; color:var(--chalk-dim);">오현중학교 1학년 과학 김보영</div>
  `;
}

// ============================================================
// INIT
// ============================================================
renderStart();
</script>
</body>
</html>
